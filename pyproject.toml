[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tagesschau-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for tagesschau.de — headlines, sections, regional news, videos & full article text via the official RSS feeds"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
tagesschau-mcp = "tagesschau_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tagesschau_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real tagesschau.de site"]
