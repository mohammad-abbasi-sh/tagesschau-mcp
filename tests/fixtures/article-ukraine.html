  "description" : "Unterhändler Russlands und der Ukraine haben ihre Gespräche unter US-Vermittlung in Abu Dhabi aufgenommen. Was wollen die beiden Kriegsparteien? Welche Rolle spielen die USA und Europa? Und was von Verhandlungen in Abu Dhabi zu erwarten?",
  "keywords" : [ "Ukraine", "Russland", "Abu Dhabi" ],
  "articleBody" : "Unterhändler Russlands und der Ukraine haben ihre Gespräche unter US-Vermittlung in Abu Dhabi aufgenommen. Was wollen die beiden Kriegsparteien? Welche Rolle spielen die USA und Europa? Und was von Verhandlungen in Abu Dhabi zu erwarten?  Erstmals seit acht Monaten verhandeln die Ukraine und Russland wieder direkt über ein Ende des Krieges. In Abu Dhabi in den Vereinigten Arabischen Emiraten haben von den USA vermittelte Gespräche zwischen Russland und der Ukraine begonnen. Sie sollen zwei Tage dauern. US-Präsident Donald Trump hatte durch Äußerungen über ein baldiges \"großes schönes Abkommen\" Erwartungen geweckt, kurz vor einem Durchbruch zu stehen. Das erwarten Beobachter allerdings nicht. Doch immerhin wird überhaupt wieder miteinander gesprochen.  Wer nimmt an dem Treffen teil? Für die Ukraine ist Chefunterhändler Rustem Umjerow dabei, für Russland der Gesandte von Staatschef Wladimir Putin, Wladimir Medinski. Aus den USA sollen Trumps Sondergesandter Steve Witkoff und sein Schwiegersohn Jared Kushner teilnehmen. Auch Vertreter der europäischen Länder - darunter Deutschlands - sowie von EU und NATO sind in Abu Dhabi dabei. Ob sie aber nur mit der ukrainischen Delegation reden oder auch direkt an den Gesprächen zwischen Kiew, Moskau und Washington teilnehmen, ist unklar.  Laut Kushner werden die \"europäischen Partner\" nur am Rande informiert, ein breiteres Format mit europäischer Beteiligung soll erst bei \"Fortschritten\" folgen.    Warum wird gerade jetzt wieder verhandelt? Ursprünglich sollten die Verhandlungen schon im März weitergehen. Der von Trump begonnene Krieg gegen Iran band aber die Aufmerksamkeit Washingtons - Witkoff und Kushner führten Gespräche mit Teheran. Der ukrainische Präsident Wolodymyr Selenskyj wollte das Treffen in Abu Dhabi schon früher anberaumen. Für sein Land war der Druck für Verhandlungen zuletzt gestiegen: Zum einen wegen des Getreide-Exporteinbruchs aufgrund der von Russland blockierten Seehäfen. Vor allem aber wegen der verheerenden russischen Angriffe auf Energieanlagen.  Was will die Ukraine erreichen? Sicherheitsgarantien, eine Waffenruhe im Schwarzen Meer und vor allem das Ende der Angriffe auf die Strom-, Wasser- und Wärmeversorgung im Land. Nach massiven russischen Luftangriffen leben Millionen Ukrainer derzeit bei Außentemperaturen um den Gefrierpunkt - und der Winter hat gerade erst begonnen. Zudem will Kiew die Rückkehr von verschleppten Kindern aus den besetzten Gebieten und weitere Gefangenenaustausche thematisieren - diese hatte es in der Vergangeheit schon mehrmals gegeben. Und: Die Gespräche sollen einen von Präsident Selenskyj angestrebten Gipfel mit Putin vorbereiten helfen. Dafür ist aber aus Kiewer Sicht ein Waffenstillstand notwendig, erst dann können die für Moskau besonders wichtigen Gebietsfragen besprochen werden.  Was erwartet Russland von den Gesprächen? Moskau beharrt unverändert auf seinen Maximalforderungen, die auf eine Unterwerfung der Ukraine hinauslaufen. Putin hat jeden davon abweichenden Versuch, den Krieg gegen die Ukraine zu beenden, abgewiesen. An einer diplomatischen Lösung zeigt der Kreml bislang kein Interesse.  So fordert Russland weiterhin nicht nur die Abtretung der derzeit besetzten ukrainischen Gebiete, sondern auch jener von Russland völkerrechtswidrig annektierten Gebiete, die es gar nicht besetzt hält. Ein US-Regierungsvertreter erklärte, Russland und die Ukraine zeigten hinter den Kulissen eine gewisse Flexibilität hinsichtlich territorialer Ansprüche. Doch das heißt es aus US-Kreisen schon seit Langem. Zudem fordert Russland eine großteils entmilitarisierte und damit wehrlose Rumpf-Ukraine; den Verzicht auf einen NATO-Beitritt; sowie eine \"Entnazifizerung\" des Landes, womit die Ablösung der derzeitigen Regierung in Kiew durch eine für Russland genehme Marionettenregierung gemeint sein dürfte. Ein Waffenstillstand ist aus russischer Sicht erst dann möglich, wenn diese Punkte zu Russlands Zufriedenheit geklärt sind.  Welches Interesse haben die USA? Präsident Trump hängt sein Wahlkampfversprechen nach, den Krieg innerhalb von 24 Stunden zu beenden. Trotz Vermittlungsbemühungen wurde bislang kein Durchbruch erzielt. Vor Beginn der Verhandlungen sprach Trump von einem angeblich kurz vor der Unterschrift stehenden Abkommen, das \"ganz Europa betreffen könnte\". Beide Seiten seien des Kämpfens müde, behauptete er. \"Wir sehen auch eine sehr starke Bereitschaft, den Krieg zwischen Russland und der Ukraine zu beenden.\" Ein Ziel Washingtons ist es auch, Russland aus dem chinesischen Einflussbereich herauszuhalten. Moskau soll über eine Wiederherstellung der wirtschaftlichen Beziehungen kompromissbereiter gemacht werden.  Welche Rolle spielen die Europäer? Am liebsten würden Russland und die USA allein über die Ukraine verhandeln. Nach Trumps Ankündigung des Abkommens, das \"ganz Europa betreffen könnte\", schrillten die Alarmglocken. Frankreichs Außenminister Jean-Noël Barrot sagte, es könne keine Gespräche mit Russland über die Sicherheit Europas geben, bevor ein Waffenstillstand vereinbart und Frieden hergestellt sei. Auch Bundesaußenminister Johann Wadephul sagte, es sei nicht möglich, ohne Europa eine Lösung des Kriegs zu finden. Vor den Verhandlungen in Abu Dhabi kochte wieder das Thema hoch, wer Europas offizieller Unterhändler sein soll. Italiens Ministerpräsidentin Giorgia Meloni hatte dazu \"ein für alle Mal\" eine verbindliche Entscheidung gefordert. Andernfalls drohe Europa im Verhandlungsprozess die Bedeutungslosigkeit.   Was ist von den Gesprächen zu erwarten? Selenskyjs Kanzleichef Kyrylo Budanow äußerte \"verhaltenen Optimismus\", erwartet aber keinen Durchbruch. Realistisch ist vor allem eine Teilwaffenruhe für Seeangriffe, die nicht nur die Türkei seit Monaten fordert, denn das Schwarze Meer zählt inzwischen zu den gefährlichsten Seeregionen der Welt. Die Ukraine und Russland haben daran beide für die Wiederaufnahme von Getreideausfuhren Interesse. Beim wichtigen Punkt nach einer Waffenruhe rund um die ukrainischen Energieanlagen ist die Lage unklarer: Moskau setzt auf die Angriffe als Druckmittel im Winter, Kiew hingegen auf Drohnenangriffe auf russische Raffinerien, um dort eine Spritknappheit zu erzeugen und Moskaus Kriegsmaschinerie die Einnahmen zu kappen. Als Geste des guten Willens könnte am Ende der Gespräche auch nur ein weiterer Gefangenenaustausch vereinbart werden. Mit Informationen von Sabrina Fritz, ARD Brüssel",
